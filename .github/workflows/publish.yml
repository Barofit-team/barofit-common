name: Publish to GitHub Packages

on:
  push:
    branches: [dev]
    paths:
      - 'common/**'
      - 'runtime/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Libraries
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew publish --no-daemon

      - name: Notify MS repos to re-run CI with the new package
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          for repo in barofit-identity barofit-routine barofit-workout barofit-analytics barofit-report; do
            echo "Dispatching common-published to ${repo}"
            gh api "repos/Barofit-team/${repo}/dispatches" \
              -f event_type='common-published' \
              -f "client_payload[common_sha]=${GITHUB_SHA}"
          done